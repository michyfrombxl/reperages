<style>
:root{
  --anthracite:#1F2937;
  --ambre:#B45309;
  --ambre-clair:#FDF3E7;
  --fond:#F6F5F2;
  --carte:#FFFFFF;
  --texte:#1F2937;
  --texte-2:#6B7280;
  --bord:#E3E1DC;
  --danger:#B42318;
  --ok:#1B7A43;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{
  font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--fond);color:var(--texte);line-height:1.5;
  min-height:100vh;
}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font:inherit;color:inherit}
img{display:block;max-width:100%}

/* ---------- Barre d'application ---------- */
.appbar{
  position:sticky;top:0;z-index:20;
  background:var(--anthracite);color:#F9FAFB;
  display:flex;align-items:center;gap:.7rem;
  padding:.8rem 1rem;
  padding-top:calc(.8rem + env(safe-area-inset-top));
  box-shadow:0 1px 4px rgba(0,0,0,.25);
}
.appbar .logo{flex:none;width:30px;height:30px}
.appbar h1{font-size:1.1rem;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar .version{font-size:.72rem;opacity:.75;font-weight:400;margin-left:.4rem}
.btn-icone{
  flex:none;width:44px;height:44px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:1.35rem;color:#F9FAFB;
}
.btn-icone:active{background:rgba(255,255,255,.15)}

/* ---------- Écrans ---------- */
.ecran{display:none;max-width:640px;margin:0 auto;padding:1rem;padding-bottom:6.5rem}
.ecran.actif{display:block}

/* ---------- Liste ---------- */
.filtres{display:flex;gap:.5rem;margin-bottom:1rem}
.chip{
  padding:.55rem 1rem;border-radius:999px;font-size:.92rem;font-weight:500;
  background:var(--carte);border:1.5px solid var(--bord);color:var(--texte-2);
}
.chip.actif{background:var(--anthracite);border-color:var(--anthracite);color:#fff}
/* E5 — le filtre étoile est un second axe : décalé et de couleur distincte */
.chip-etoile{
  margin-left:auto;padding:.5rem .7rem;display:flex;align-items:center;justify-content:center;
  color:#B8B4AC;
}
.chip-etoile.actif{background:var(--ambre);border-color:var(--ambre);color:#fff}
.carte-sortie{
  background:var(--carte);border:1px solid var(--bord);border-radius:12px;
  overflow:hidden;margin-bottom:.9rem;display:flex;align-items:stretch;
  box-shadow:0 1px 3px rgba(31,41,55,.06);cursor:pointer;
}
.carte-sortie:active{background:#FAF9F6}
.carte-vignette{
  flex:none;width:96px;background:#ECEAE5;
  display:flex;align-items:center;justify-content:center;color:#B8B4AC;font-size:1.6rem;
}
.carte-vignette img{width:100%;height:100%;object-fit:cover}
/* E7 — numéro de sortie en guise de vignette quand il n'y a pas de photo */
.carte-vignette .num{
  font-size:2rem;font-weight:600;color:var(--anthracite);letter-spacing:.01em;
  line-height:1;text-align:center;
}
.carte-vignette .num small{display:block;font-size:.6rem;font-weight:600;letter-spacing:.12em;
  text-transform:uppercase;color:#A9A49B;margin-bottom:.22rem}
/* E5 — étoile sur la carte de liste */
.carte-etoile{
  flex:none;width:46px;align-self:stretch;background:none;border:none;padding:0;
  display:flex;align-items:center;justify-content:center;
  color:#CFCBC3;cursor:pointer;-webkit-tap-highlight-color:transparent;
}
.carte-etoile.on{color:var(--ambre)}
.carte-etoile:active{background:#F3F1EC}
.carte-corps{flex:1;padding:.8rem .9rem;min-width:0}
.carte-corps h3{font-size:.98rem;font-weight:600;line-height:1.3;margin-bottom:.3rem}
.carte-meta{font-size:.82rem;color:var(--texte-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{
  display:inline-block;margin-top:.45rem;padding:.15rem .6rem;border-radius:999px;
  font-size:.72rem;font-weight:600;letter-spacing:.02em;
}
.badge.a-faire{background:var(--ambre-clair);color:var(--ambre)}
.badge.faite{background:#E8F5EE;color:var(--ok)}
.vide{
  text-align:center;color:var(--texte-2);padding:3rem 1rem;font-size:.95rem;
}
.bandeau-rappel{
  background:var(--ambre-clair);border:1px solid #EAD3B5;border-radius:10px;
  padding:.7rem .9rem;margin-bottom:1rem;font-size:.86rem;color:#7C4A0A;
  display:flex;align-items:center;gap:.6rem;
}
.bandeau-rappel button{font-weight:600;color:var(--ambre);text-decoration:underline;flex:none}

/* ---------- Bouton + flottant ---------- */
.fab{
  position:fixed;right:1.1rem;bottom:calc(1.3rem + env(safe-area-inset-bottom));z-index:15;
  width:62px;height:62px;border-radius:50%;
  background:var(--ambre);color:#fff;font-size:2rem;font-weight:300;
  box-shadow:0 3px 10px rgba(180,83,9,.4);
  display:flex;align-items:center;justify-content:center;
}
.fab:active{transform:scale(.95)}

/* ---------- Fiche détail ---------- */
.bandeau-titre{
  background:var(--anthracite);color:#F9FAFB;border-radius:12px;
  padding:1rem 1.1rem;margin-bottom:.2rem;position:relative;
}
/* E5 — étoile dans l'en-tête de la fiche */
.etoile-titre{
  position:absolute;top:.5rem;right:.5rem;width:44px;height:44px;
  background:none;border:none;padding:0;display:flex;align-items:center;justify-content:center;
  color:rgba(249,250,251,.45);cursor:pointer;-webkit-tap-highlight-color:transparent;
}
.etoile-titre.on{color:#F0A24B}
/* E7 — icône « information sur le parcours », à gauche de l'étoile.
   Toujours présente : discrète quand il n'y a rien à lire, ambre sinon. */
.info-titre{
  position:absolute;top:.5rem;right:3.25rem;width:44px;height:44px;
  background:none;border:none;padding:0;display:flex;align-items:center;justify-content:center;
  color:rgba(249,250,251,.28);cursor:pointer;-webkit-tap-highlight-color:transparent;
}
.info-titre.dispo{color:#F0A24B}
/* Un SVG au centre vide (fill="none") n'est cliquable que sur ses traits :
   le disque du ⓘ et l'intérieur de l'étoile creuse ne recevaient rien. On
   neutralise le dessin pour que le clic atteigne toujours le bouton, qui
   fait bien ses 44 px. Le z-index et touch-action sont là par précaution :
   plus rien ne peut passer devant, et le tactile ne perd pas de temps à
   guetter un double-appui avant de réagir. */
.etoile-titre,.info-titre{z-index:2;touch-action:manipulation;border-radius:50%}
.etoile-titre svg,.info-titre svg{pointer-events:none}
/* Retour visuel : la zone réellement sensible devient visible, ce qui lève
   le doute au lieu de le laisser deviner. */
.etoile-titre:active,.info-titre:active{background:rgba(255,255,255,.20)}
@media (hover:hover){
  .etoile-titre:hover,.info-titre:hover{background:rgba(255,255,255,.12)}
}
.bandeau-titre .numero{font-size:.75rem;opacity:.7;letter-spacing:.08em;text-transform:uppercase}
.bandeau-titre h2{font-size:1.15rem;font-weight:600;line-height:1.35;margin-top:.15rem}
.filet{height:3px;background:var(--ambre);border-radius:2px;margin:.7rem 0 1rem}
.bloc{
  background:var(--carte);border:1px solid var(--bord);border-radius:12px;
  padding:1rem 1.1rem;margin-bottom:.9rem;
}
.libelle{
  font-size:.75rem;font-weight:700;color:var(--ambre);
  letter-spacing:.09em;text-transform:uppercase;margin-bottom:.35rem;
}
.info-ligne{display:flex;gap:.6rem;margin-bottom:.55rem;font-size:.95rem}
.info-ligne:last-child{margin-bottom:0}
.info-ligne .cle{flex:none;width:7.2rem;font-size:.78rem;font-weight:700;color:var(--ambre);letter-spacing:.06em;text-transform:uppercase;padding-top:.15rem}
.etapes-liste{list-style:none;counter-reset:etape}
.etapes-liste li{
  counter-increment:etape;position:relative;padding:.3rem 0 .3rem 2.1rem;font-size:.95rem;
}
.etapes-liste li::before{
  content:counter(etape);position:absolute;left:0;top:.32rem;
  width:1.5rem;height:1.5rem;border-radius:50%;
  background:var(--ambre-clair);color:var(--ambre);
  font-size:.78rem;font-weight:700;display:flex;align-items:center;justify-content:center;
}
.btn{
  display:flex;align-items:center;justify-content:center;gap:.5rem;
  width:100%;padding:.95rem 1rem;border-radius:12px;
  font-size:1rem;font-weight:600;min-height:52px;
}
.btn-plein{background:var(--anthracite);color:#fff}
.btn-plein:active{background:#111827}
.btn-ambre{background:var(--ambre);color:#fff}
.btn-ambre:active{background:#92400E}
.btn-clair{background:var(--carte);border:1.5px solid var(--bord);color:var(--texte)}
.btn-clair:active{background:#F1EFEA}
.btn-danger-clair{background:var(--carte);border:1.5px solid #F0C6C1;color:var(--danger)}
.btn-danger-clair:active{background:#FBEEEC}
.grille-photos{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.grille-photos .photo,.grille-photos .ajout-photo{
  aspect-ratio:1;border-radius:8px;overflow:hidden;position:relative;
}
.grille-photos .photo img{width:100%;height:100%;object-fit:cover;cursor:pointer}
.grille-photos .ajout-photo{
  border:2px dashed var(--bord);background:#FBFAF8;color:var(--texte-2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:.72rem;gap:.2rem;cursor:pointer;
}
.grille-photos .ajout-photo span{font-size:1.5rem;line-height:1;color:var(--ambre)}
.note{
  border-left:3px solid var(--ambre);background:#FBFAF8;border-radius:0 8px 8px 0;
  padding:.6rem .8rem;margin-bottom:.6rem;
}
.note .date{font-size:.72rem;color:var(--texte-2);margin-bottom:.2rem}
.note p{font-size:.92rem;white-space:pre-wrap}
.note .suppr-note{float:right;color:var(--texte-2);font-size:.85rem;padding:.1rem .3rem}
.zone-note{display:flex;gap:.5rem;margin-top:.6rem}
.zone-note textarea{
  flex:1;border:1.5px solid var(--bord);border-radius:10px;padding:.6rem .7rem;
  font-size:.95rem;resize:vertical;min-height:52px;background:#fff;
}
.zone-note button{flex:none;align-self:flex-end;padding:.7rem 1rem;border-radius:10px;background:var(--anthracite);color:#fff;font-weight:600;min-height:52px}
.barre-actions{
  position:fixed;left:0;right:0;bottom:0;z-index:15;
  background:var(--carte);border-top:1px solid var(--bord);
  display:flex;gap:.6rem;padding:.7rem 1rem;
  padding-bottom:calc(.7rem + env(safe-area-inset-bottom));
  max-width:640px;margin:0 auto;
}
.barre-actions .btn{min-height:50px;font-size:.95rem}

/* ---------- Formulaire ---------- */
.champ{margin-bottom:1rem}
.champ label{display:block;font-size:.8rem;font-weight:700;color:var(--ambre);letter-spacing:.06em;text-transform:uppercase;margin-bottom:.35rem}
.champ input[type=text],.champ textarea,.champ select{
  width:100%;border:1.5px solid var(--bord);border-radius:10px;
  padding:.75rem .8rem;font-size:1rem;background:#fff;
}
.champ input:focus,.champ textarea:focus,.champ select:focus{outline:2px solid var(--ambre);outline-offset:1px;border-color:var(--ambre)}
.champ textarea{resize:vertical;min-height:80px}
.champ .aide{font-size:.78rem;color:var(--texte-2);margin-top:.3rem;text-transform:none;letter-spacing:0;font-weight:400}
.etape-edit{display:flex;gap:.4rem;margin-bottom:.5rem}
.etape-edit input{flex:1;border:1.5px solid var(--bord);border-radius:10px;padding:.65rem .7rem;font-size:.95rem;background:#fff;min-width:0}
.etape-edit button{
  flex:none;width:44px;border:1.5px solid var(--bord);border-radius:10px;
  background:#fff;color:var(--texte-2);font-size:1rem;
}
.etape-edit button:active{background:#F1EFEA}
.btn-ajout-etape{
  width:100%;padding:.65rem;border:2px dashed var(--bord);border-radius:10px;
  color:var(--ambre);font-weight:600;font-size:.92rem;background:#FBFAF8;
}

/* ---------- Import ---------- */
.apercu-sortie{
  background:var(--carte);border:1px solid var(--bord);border-radius:12px;
  padding:.9rem 1rem;margin-bottom:.9rem;
}
.apercu-sortie.exclu{opacity:.45}
.apercu-entete{display:flex;align-items:flex-start;gap:.7rem;margin-bottom:.5rem}
.apercu-entete input[type=checkbox]{width:22px;height:22px;accent-color:var(--ambre);flex:none;margin-top:.15rem}
.apercu-entete h3{font-size:.98rem;font-weight:600;line-height:1.3}
.apercu-detail{font-size:.85rem;color:var(--texte-2);padding-left:2rem}
.apercu-detail b{color:var(--texte);font-weight:600}

/* ---------- Superpositions ---------- */
.voile{
  position:fixed;inset:0;background:rgba(17,24,39,.55);z-index:40;
  display:none;align-items:flex-end;justify-content:center;
}
.voile.actif{display:flex}
.feuille{
  background:var(--carte);width:100%;max-width:640px;
  border-radius:18px 18px 0 0;padding:1.2rem 1.1rem;
  padding-bottom:calc(1.2rem + env(safe-area-inset-bottom));
  animation:monter .18s ease-out;
}
@keyframes monter{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.feuille h3{font-size:1.05rem;margin-bottom:1rem}
.feuille .btn{margin-bottom:.6rem}
.feuille p{font-size:.92rem;color:var(--texte-2);margin-bottom:1rem}
.feuille .stat{font-size:.9rem;color:var(--texte);margin-bottom:.5rem;display:flex;justify-content:space-between;gap:1rem}
.feuille .stat span:last-child{color:var(--texte-2)}
.feuille hr{border:none;border-top:1px solid var(--bord);margin:.9rem 0}
/* Un texte informatif peut être long : la feuille défile plutôt que de
   déborder de l'écran, et le bouton de fermeture reste atteignable. */
.feuille{max-height:82vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.texte-info p{
  font-size:.95rem;color:var(--texte);margin-bottom:.75rem;text-align:left;
}
.texte-info p:last-child{margin-bottom:1rem}
.texte-info.vide p{color:var(--texte-2);font-style:italic}

/* ---------- Visionneuse ---------- */
.visionneuse{
  position:fixed;inset:0;background:#0B0F16;z-index:50;display:none;
  flex-direction:column;
}
.visionneuse.actif{display:flex}
.visionneuse .haut{
  display:flex;justify-content:space-between;align-items:center;
  padding:.7rem 1rem;padding-top:calc(.7rem + env(safe-area-inset-top));color:#E5E7EB;
}
.visionneuse .haut .compteur{font-size:.85rem;opacity:.8}
.visionneuse .haut button{font-size:1.5rem;width:44px;height:44px;color:#E5E7EB}
.visionneuse .image{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;position:relative}
.visionneuse .image img{max-width:100%;max-height:100%;object-fit:contain}
.visionneuse .nav{
  position:absolute;top:0;bottom:0;width:30%;
}
.visionneuse .nav.prec{left:0}
.visionneuse .nav.suiv{right:0}
.visionneuse .bas{
  padding:.8rem 1rem;padding-bottom:calc(.8rem + env(safe-area-inset-bottom));
  display:flex;gap:.6rem;align-items:center;
}
.visionneuse .bas input{
  flex:1;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);
  border-radius:10px;padding:.65rem .8rem;color:#F3F4F6;font-size:.92rem;min-width:0;
}
.visionneuse .bas input::placeholder{color:rgba(255,255,255,.45)}
.visionneuse .bas button{
  flex:none;padding:.65rem .9rem;border-radius:10px;font-size:.9rem;font-weight:600;
}
.visionneuse .bas .enr{background:var(--ambre);color:#fff}
.visionneuse .bas .sup{background:rgba(255,255,255,.12);color:#FCA5A5}

/* ---------- Toast ---------- */
.toast{
  position:fixed;left:50%;bottom:calc(6rem + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--anthracite);color:#F9FAFB;padding:.7rem 1.2rem;border-radius:999px;
  font-size:.9rem;z-index:60;box-shadow:0 3px 10px rgba(0,0,0,.3);
  opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw;text-align:center;
}
.toast.actif{opacity:1}

@media (min-width:641px){
  .fab{right:calc(50% - 320px + 1.1rem)}
}
</style>
</head>
<body>

<header class="appbar" id="appbar">
  <svg class="logo" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="22" fill="#111827"/><rect x="28" y="14" width="44" height="72" rx="7" fill="none" stroke="#F9FAFB" stroke-width="5"/><circle cx="50" cy="36" r="11" fill="none" stroke="#B45309" stroke-width="5"/><circle cx="50" cy="66" r="13" fill="#B45309"/><circle cx="54" cy="62" r="3.5" fill="#F9FAFB"/></svg>
  <button class="btn-icone" id="btn-retour" style="display:none" onclick="retour()" aria-label="Retour">←</button>
  <h1 id="titre-appbar">Repérages <span class="version" id="aff-version"></span></h1>
  <button class="btn-icone" id="btn-reglages" onclick="ouvrirReglages()" aria-label="Réglages">⚙</button>
</header>

<!-- ================= LISTE ================= -->
<main class="ecran actif" id="ecran-liste">
  <div id="zone-rappel"></div>
  <div class="filtres" role="tablist">
    <button class="chip actif" data-filtre="toutes" onclick="changerFiltre('toutes')">Toutes</button>
    <button class="chip" data-filtre="a_faire" onclick="changerFiltre('a_faire')">À faire</button>
    <button class="chip" data-filtre="faite" onclick="changerFiltre('faite')">Faites</button>
    <button class="chip chip-etoile" data-filtre="etoile" onclick="changerFiltre('etoile')"
            aria-label="Sorties étoilées" title="Sorties étoilées"></button>
  </div>
  <div id="liste-sorties"></div>
</main>

<!-- ================= DÉTAIL ================= -->
<main class="ecran" id="ecran-detail"></main>

<!-- ================= FORMULAIRE ================= -->
<main class="ecran" id="ecran-form"></main>

<!-- ================= IMPORT ================= -->
<main class="ecran" id="ecran-import"></main>

<button class="fab" id="fab" onclick="ouvrirMenuPlus()" aria-label="Ajouter une sortie">+</button>

<!-- Feuilles (menus du bas) -->
<div class="voile" id="voile" onclick="if(event.target===this)fermerFeuille()">
  <div class="feuille" id="feuille"></div>
</div>

<!-- Visionneuse plein écran -->
<div class="visionneuse" id="visionneuse">
  <div class="haut">
    <span class="compteur" id="vis-compteur"></span>
    <button onclick="fermerVisionneuse()" aria-label="Fermer">✕</button>
  </div>
  <div class="image">
    <img id="vis-image" alt="">
    <div class="nav prec" onclick="visNaviguer(-1)"></div>
    <div class="nav suiv" onclick="visNaviguer(1)"></div>
  </div>
  <div class="bas">
    <input type="text" id="vis-legende" placeholder="Légende…" maxlength="120">
    <button class="enr" onclick="enregistrerLegende()">OK</button>
    <button class="sup" onclick="supprimerPhoto()">Suppr.</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<input type="file" id="fichier-txt" accept=".txt,text/plain" style="display:none">
<input type="file" id="fichier-photos" accept="image/*" multiple style="display:none">
<input type="file" id="fichier-camera" accept="image/*" capture="environment" style="display:none">
<input type="file" id="fichier-restauration" accept=".json,application/json" style="display:none">

<script>
"use strict";
/* =========================================================
   Carnet de sorties photo — v1
   Fichier unique HTML/CSS/JS — persistance IndexedDB
   ========================================================= */
const VERSION = "v1.8.9";
const DATE_VERSION = "juillet 2026";
const AUTEUR = "Michel Masquelier (michy)";
const MAIL_AUTEUR = "michel.masquelier@gmail.com";
const URL_KOFI = "https://ko-fi.com/michelmasquelier";
document.getElementById("aff-version").textContent = VERSION;

/* ---------- Utilitaires ---------- */
function uuid(){ return crypto.randomUUID ? crypto.randomUUID() : Date.now()+"-"+Math.random().toString(16).slice(2); }
function esc(s){ return String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function toast(msg, duree=2600){
  const t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("actif");
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("actif"), duree);
}
function dateFR(iso){
  if(!iso) return "";
  const d=new Date(iso);
  return d.toLocaleDateString("fr-BE",{day:"numeric",month:"long",year:"numeric"})+" à "+
         d.toLocaleTimeString("fr-BE",{hour:"2-digit",minute:"2-digit"});
}
function dateCourteFR(iso){
  if(!iso) return "";
  return new Date(iso).toLocaleDateString("fr-BE",{day:"numeric",month:"short",year:"numeric"});
}

/* ---------- IndexedDB ---------- */
const NOM_DB="carnet-sorties", STORE="sorties";
let db=null;
function ouvrirDB(){
  return new Promise((res,rej)=>{
    const req=indexedDB.open(NOM_DB,1);
    req.onupgradeneeded=e=>{
      const d=e.target.result;
      if(!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE,{keyPath:"id"});
    };
    req.onsuccess=e=>{db=e.target.result;res(db);};
    req.onerror=()=>rej(req.error);
  });
}
function dbTous(){
  return new Promise((res,rej)=>{
    const req=db.transaction(STORE).objectStore(STORE).getAll();
    req.onsuccess=()=>res(req.result); req.onerror=()=>rej(req.error);
  });
}
function dbLire(id){
  return new Promise((res,rej)=>{
    const req=db.transaction(STORE).objectStore(STORE).get(id);
    req.onsuccess=()=>res(req.result); req.onerror=()=>rej(req.error);
  });
}
function dbEcrire(sortie){
  return new Promise((res,rej)=>{
    const tx=db.transaction(STORE,"readwrite");
    tx.objectStore(STORE).put(sortie);
    tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error);
  });
}
function dbSupprimer(id){
  return new Promise((res,rej)=>{
    const tx=db.transaction(STORE,"readwrite");
    tx.objectStore(STORE).delete(id);
    tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error);
  });
}
function dbVider(){
  return new Promise((res,rej)=>{
    const tx=db.transaction(STORE,"readwrite");
    tx.objectStore(STORE).clear();
    tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error);
  });
}

/* ---------- E6 : identifiant de parcours ----------
   Distinct de `id` : `id` identifie la fiche sur CE téléphone, `idParcours`
   identifie le parcours lui-même et reste le même chez tous ceux qui l'ont
   importé. C'est ce qui permettra de regrouper les visites d'un même parcours
   (E3, la collection), même si le titre a été modifié entre-temps.
   Les trois sorties préchargées portent un identifiant écrit en dur : sans
   cela, chaque téléphone en fabriquerait un différent et le regroupement
   serait impossible précisément là où il compte le plus.                     */
/* Titres des trois parcours tels qu'ils étaient livrés jusqu'en v1.8.2,
   réduits à leurs lettres. Sert à les retrouver après leur réécriture.       */
const TITRES_HISTORIQUES={
  "schaerbeekquartierdesfleursparcjosaphat":"rpg-bxl-josaphat",
  "garedumidimarchedesmarollesplacedujeudeballe":"rpg-bxl-marolles",
  "tourtaxisquaidespenichesquartierkanal":"rpg-bxl-kanal"
};
function nouvelIdParcours(){
  return "rpg-"+uuid().replace(/-/g,"").slice(0,12);
}
function normaliserTitre(t){
  return String(t||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9]+/g,"");
}
/* Rattrapage au démarrage : les sorties créées avant la v1.8 n'ont ni
   identifiant de parcours ni champ étoile. On leur en attribue un, en
   reconnaissant au passage les trois sorties préchargées à leur titre pour
   qu'elles récupèrent bien l'identifiant commun.                             */
async function migrerV18(){
  const tous=await dbTous();
  const refs=new Map(SORTIES_INITIALES.map(b=>[normaliserTitre(b.titre), b.idParcours]));
  /* Les trois parcours livrés ont été réécrits en v1.8.3 : leur titre actuel
     ne ressemble plus à celui qu'ont les téléphones installés avant. Sans
     cette table, une fiche venue de la v1.7 recevrait un identifiant neuf et
     ne serait plus reconnue comme l'un des parcours de référence — ni ici,
     ni par la mise à jour des textes qui suit. */
  for(const [ancien,id] of Object.entries(TITRES_HISTORIQUES)) refs.set(ancien,id);
  for(const s of tous){
    let modifiee=false;
    if(!s.idParcours){
      s.idParcours = refs.get(normaliserTitre(s.titre)) || nouvelIdParcours();
      modifiee=true;
    }
    if(typeof s.etoile!=="boolean"){ s.etoile=false; modifiee=true; }
    if(modifiee) await dbEcrire(s);
  }
}

/* ---------- Mise à jour des trois parcours de référence ----------
   Les parcours livrés avec l'app sont retouchés d'une version à l'autre. Le
   préchargement n'ayant lieu qu'à la toute première ouverture, un téléphone
   déjà installé garde la version qu'il avait : c'est ici qu'on le rattrape.

   Règle prudente, en deux temps :
   1. si la fiche correspond mot pour mot à l'une des versions déjà livrées
      (titre, intention ET étapes, réduits à leurs lettres), personne n'y a
      touché : on la remplace par la version courante ;
   2. si elle a été retouchée, on n'écrase rien — on se contente d'ajouter le
      texte informatif s'il manque.
   Dans les deux cas, photos, notes, statut, étoile, matériel et numéro sont
   conservés : rien de ce que l'utilisateur a produit n'est perdu.

   La fonction se désamorce d'elle-même : la version courante ne figure jamais
   dans la table, donc une fiche à jour n'est plus jamais réécrite. Les étapes
   entrent dans l'empreinte depuis la v1.8.6 : sans elles, deux versions qui ne
   diffèrent que par leur itinéraire seraient confondues.                      */
function empreinteParcours(s){
  return normaliserTitre(s.titre)+"|"+normaliserTitre(s.intention)+"|"+
         normaliserTitre((s.etapes||[]).map(e=>e.nom).join(" "));
}
const EMPREINTES_LIVREES={
  "rpg-bxl-josaphat":["schaerbeekquartierdesfleursparcjosaphat|serieentiereaf2personnescadreesdansdeselementsarchitecturauxportesarbresabrisdetrampasderecadrageaposterioricomposerprecisementdansleviseur|placedaillyavenuelouisbertrandruesduquartierdesfleursparcjosaphatetangetterrassesdescafes",
    "schaerbeekdelavenuelouisbertrandauquartierdesfleurs4km|serieentierecadreedansdeselementsarchitecturauxportesarbresabrisdetramalternantavecdesplanslargesdesruesouavenuesdetaildansleparcquirappelleunelementdarchitecturepasderecadrageaposterioricomposerprecisementdansleviseurtoujoursenorientationpaysage|avenuelouisbertrandboulevardlambermontruedesmimosasavenuegeneraleisenhowerparcjosaphateglisesaintservais"],
  "rpg-bxl-marolles":["garedumidimarchedesmarollesplacedujeudeballe|uneseuleimageparinteractionattendreungesteunregardouunepausesignificativeavantdedeclencherpenserleditingavantdappuyer|garedumidilesmarollesruehauteplacedujeudeballepalaisdejustice"],
  "rpg-bxl-kanal":["tourtaxisquaidespenichesquartierkanal|seriecoherenteauformatcarreechellehumainefacealageometrieurbainehorizondroitviseurdepoitrinepourunpointdevuediscretmoinsfrontal|tourtaxischeminlelongducanalquaidespenichesquartierkanalsainctelette"]
};
async function majParcoursLivres(){
  const courants=new Map(SORTIES_INITIALES.map(b=>[b.idParcours,b]));
  const tous=await dbTous();
  for(const s of tous){
    const neuf=courants.get(s.idParcours);
    if(!neuf) continue;                       // parcours personnel : on n'y touche pas
    const connues=EMPREINTES_LIVREES[s.idParcours]||[];
    if(connues.includes(empreinteParcours(s))){
      Object.assign(s,{
        titre:neuf.titre, modeDeplacement:neuf.modeDeplacement,
        appareil:neuf.appareil, moment:neuf.moment,
        etapes:neuf.etapes.map(e=>({nom:e.nom})),
        pourquoi:neuf.pourquoi, intention:neuf.intention,
        infoParcours:neuf.infoParcours
      });
      await dbEcrire(s);
    } else if(!(s.infoParcours||"").trim()){
      s.infoParcours=neuf.infoParcours;
      await dbEcrire(s);
    }
  }
}

/* ---------- E5 : étoile ----------
   Dessinée en SVG plutôt qu'avec un caractère : un glyphe absent de la police
   du téléphone s'afficherait en carré vide, ce qui donnerait exactement
   l'impression de rendu cassé que E7 cherche à supprimer.                    */
function svgEtoile(pleine){
  return '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" '+
    'fill="'+(pleine?"currentColor":"none")+'" stroke="currentColor" stroke-width="1.7" '+
    'stroke-linejoin="round">'+
    '<rect x="0" y="0" width="24" height="24" fill="transparent" stroke="none"/>'+
    '<path d="M12 3.5l2.7 5.45 6.02.88-4.36 4.25 1.03 5.99L12 17.2'+
    'l-5.39 2.87 1.03-5.99L3.28 9.83l6.02-.88z"/></svg>';
}
async function basculerEtoile(id, ev, source){
  if(ev) ev.stopPropagation();   // sans ceci, marquer une sortie l'ouvrirait aussitôt
  const s=await dbLire(id);
  if(!s) return;
  s.etoile=!s.etoile;
  await dbEcrire(s);
  if(source==="detail") await afficherDetail(id); else await afficherListe();
  toast(s.etoile ? "Sortie étoilée." : "Étoile retirée.");
}

/* ---------- E7 : information sur le parcours ----------
   Texte documentaire (histoire du quartier, monument, personnalité) fourni
   avec le parcours dans le fichier .txt. Il décrit le PARCOURS, pas la visite :
   il voyage donc avec le .txt d'échange, au même titre que les étapes, et
   n'est volontairement pas éditable dans le formulaire — un utilisateur qui
   crée sa propre sortie n'a rien à y écrire.
   Dessiné en SVG plutôt qu'avec le caractère ⓘ, absent de certaines polices
   Android : il s'afficherait alors en carré vide.                            */
function svgInfo(){
  return '<svg viewBox="0 0 24 24" width="23" height="23" fill="none" '+
    'stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true">'+
    /* Carré transparent : un navigateur qui ignorerait pointer-events trouve
       malgré tout ici une surface peinte, donc cliquable, sur toute l'icône. */
    '<rect x="0" y="0" width="24" height="24" fill="transparent" stroke="none"/>'+
    '<circle cx="12" cy="12" r="9.2"/>'+
    '<path d="M12 11.1v5.3"/>'+
    '<circle cx="12" cy="7.7" r="1.1" fill="currentColor" stroke="none"/>'+
    '</svg>';
}
/* Les sauts de ligne doubles du .txt deviennent des paragraphes. Le texte est
   échappé avant affichage : il vient d'un fichier extérieur, jamais de HTML. */
function texteEnParagraphes(t){
  return String(t||"").split(/\n{2,}/).map(p=>p.trim()).filter(Boolean)
    .map(p=>'<p>'+esc(p).replace(/\n/g,"<br>")+'</p>').join("");
}
async function ouvrirInfoParcours(){
  const s=await dbLire(idCourant);
  if(!s) return;
  const texte=(s.infoParcours||"").trim();
  ouvrirFeuille(
    '<h3>À propos du parcours</h3>'+
    '<div class="texte-info'+(texte?"":" vide")+'">'+
      (texte ? texteEnParagraphes(texte)
             : '<p>Pas d\'information disponible pour ce parcours.</p>')+
    '</div>'+
    '<button class="btn btn-clair" onclick="fermerFeuille()">Fermer</button>');
}

/* ---------- État et navigation ---------- */
let filtreCourant="toutes";
let idCourant=null;         // sortie affichée / éditée
let pileEcrans=[];          // pour le bouton retour
const urlsObjets=new Map(); // cache des object URLs des photos

function urlPhoto(p){
  if(!urlsObjets.has(p.id)) urlsObjets.set(p.id, URL.createObjectURL(p.blob));
  return urlsObjets.get(p.id);
}
function libererUrl(idPhoto){
  if(urlsObjets.has(idPhoto)){ URL.revokeObjectURL(urlsObjets.get(idPhoto)); urlsObjets.delete(idPhoto); }
}
function montrerEcran(nom, empiler=true){
  if(empiler){
    const actuel=document.querySelector(".ecran.actif");
    if(actuel && actuel.id!=="ecran-"+nom) pileEcrans.push(actuel.id.replace("ecran-",""));
  }
  document.querySelectorAll(".ecran").forEach(e=>e.classList.remove("actif"));
  document.getElementById("ecran-"+nom).classList.add("actif");
  const surListe = nom==="liste";
  document.getElementById("btn-retour").style.display = surListe? "none":"flex";
  document.getElementById("btn-reglages").style.display = surListe? "flex":"none";
  document.getElementById("fab").style.display = surListe? "flex":"none";
  document.getElementById("titre-appbar").innerHTML = surListe
    ? 'Repérages <span class="version">'+VERSION+'</span>'
    : ({detail:"Fiche sortie", form:(idCourant?"Modifier la sortie":"Nouvelle sortie"), import:"Importer un fichier"}[nom]||"Repérages");
  window.scrollTo(0,0);
}
async function retour(){
  const prec=pileEcrans.pop()||"liste";
  if(prec==="liste"){ idCourant=null; await afficherListe(); montrerEcran("liste", false); }
  else if(prec==="detail" && idCourant){ await afficherDetail(idCourant); montrerEcran("detail", false); }
  else { idCourant=null; await afficherListe(); montrerEcran("liste", false); }
}

/* ---------- Écran liste ---------- */
const MODES_LIB={pied:"À pied", velo:"Vélo", transports:"Transports", mixte:"Mixte"};
async function afficherListe(){
  const sorties=(await dbTous()).sort((a,b)=>(a.numero||0)-(b.numero||0));
  /* E5 — l'étoile est un second axe : elle ne filtre pas sur le statut mais
     sur le marqueur, et affiche donc les sorties faites comme celles à faire. */
  const visibles=sorties.filter(s=>
    filtreCourant==="toutes" ? true :
    filtreCourant==="etoile" ? s.etoile===true :
    s.statut===filtreCourant);
  const zone=document.getElementById("liste-sorties");
  if(!visibles.length){
    /* Carnet entièrement vide : c'est le seul moment où proposer de remettre
       les parcours livrés avec l'app. Le verrou de préchargement ne joue
       qu'à la première ouverture, et il peut survivre à un effacement des
       données — l'app se retrouve alors vide et sans moyen de se regarnir.
       Le bouton donne la main plutôt que d'obliger à passer par les réglages
       du navigateur, et il n'apparaît jamais tant qu'il reste une sortie. */
    zone.innerHTML='<div class="vide">'+(!sorties.length
      ? "Aucune sortie pour le moment.<br>Touchez « + » pour en créer une ou importer un fichier .txt."+
        '<button class="btn btn-clair" style="margin-top:1.1rem" onclick="rechargerParcoursLivres()">'+
        'Remettre les '+SORTIES_INITIALES.length+' parcours d\'origine</button>'
      : filtreCourant==="etoile"
        ? "Aucune sortie étoilée.<br>Touchez l'étoile d'une sortie pour la marquer."
        : "Aucune sortie dans ce filtre.")+'</div>';
  } else {
    zone.innerHTML=visibles.map(s=>{
      /* E7 — à défaut de photo, le numéro de la sortie : Repérages est un
         carnet, et les entrées d'un carnet sont numérotées. La zone cesse
         d'être un trou pour devenir un élément d'identité.                  */
      const vignette = s.photos && s.photos.length
        ? '<img src="'+urlPhoto(s.photos[0])+'" alt="">'
        : '<div class="num"><small>Parcours</small>'+(s.numero||"–")+'</div>';
      return '<article class="carte-sortie" onclick="voirDetail(\''+s.id+'\')">'+
        '<div class="carte-vignette">'+vignette+'</div>'+
        '<div class="carte-corps">'+
          '<h3>'+esc(s.titre)+'</h3>'+
          '<div class="carte-meta">'+esc(s.appareil)+'</div>'+
          '<div class="carte-meta">'+esc(s.moment)+'</div>'+
          '<span class="badge '+(s.statut==="faite"?"faite":"a-faire")+'">'+
            (s.statut==="faite" ? "Faite"+(s.dateRealisee? " · "+dateCourteFR(s.dateRealisee):"") : "À faire")+
          '</span>'+
        '</div>'+
        '<button type="button" class="carte-etoile'+(s.etoile?" on":"")+'" '+
          'onclick="basculerEtoile(\''+s.id+'\', event, \'liste\')" '+
          'aria-label="'+(s.etoile?"Retirer l\'étoile":"Étoiler cette sortie")+'">'+
          svgEtoile(!!s.etoile)+'</button>'+
        '</article>';
    }).join("");
  }
  afficherRappelSauvegarde(sorties.length);
}
function dessinerChipEtoile(){
  const c=document.querySelector('.chip-etoile');
  if(c) c.innerHTML=svgEtoile(c.classList.contains("actif"));
}
function changerFiltre(f){
  /* Le filtre ★ se comporte en interrupteur : isolé à droite et de couleur
     distincte, il ressemble à une bascule — un second tap doit donc l'éteindre
     et rendre la liste complète, plutôt que d'obliger à passer par « Toutes ». */
  if(f==="etoile" && filtreCourant==="etoile") f="toutes";
  filtreCourant=f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("actif", c.dataset.filtre===f));
  dessinerChipEtoile();
  afficherListe();
}

/* Remet les parcours livrés avec l'app, sans toucher au reste. Une sortie
   déjà présente sous le même identifiant de parcours n'est pas dupliquée :
   on préfère ne rien faire plutôt que de créer un doublon silencieux.       */
async function rechargerParcoursLivres(){
  const tous=await dbTous();
  const deja=new Set(tous.map(s=>s.idParcours));
  let numero=tous.reduce((m,x)=>Math.max(m,x.numero||0),0);
  let ajoutes=0;
  for(const base of SORTIES_INITIALES){
    if(deja.has(base.idParcours)) continue;
    numero++;
    await dbEcrire(nouvelleSortie(Object.assign({}, base, {numero})));
    ajoutes++;
  }
  localStorage.setItem("prechargementFait","1");
  await afficherListe();
  toast(ajoutes ? (ajoutes>1 ? ajoutes+" parcours rechargés." : "Parcours rechargé.")
                : "Ces parcours sont déjà dans le carnet.", 3200);
}

/* ---------- Rappel de sauvegarde ---------- */
function afficherRappelSauvegarde(nbSorties){
  const zone=document.getElementById("zone-rappel");
  const derniere=localStorage.getItem("derniereSauvegarde");
  const ignoreJusque=Number(localStorage.getItem("rappelIgnoreJusque")||0);
  const JOURS_30=30*24*3600*1000;
  const ancienne = !derniere || (Date.now()-new Date(derniere).getTime() > JOURS_30);
  if(nbSorties>0 && ancienne && Date.now()>ignoreJusque){
    zone.innerHTML='<div class="bandeau-rappel"><span style="flex:1">'+
      (derniere ? "Votre dernière sauvegarde date de plus de 30 jours." : "Aucune sauvegarde effectuée pour l'instant.")+

      '<button onclick="ignorerRappel()" aria-label="Ignorer" style="text-decoration:none">✕</button></div>';
  } else zone.innerHTML="";
}

  localStorage.setItem("rappelIgnoreJusque", String(Date.now()+7*24*3600*1000));

/* ---------- Google Maps ----------
   Deux actions volontairement séparées :
   1) l'approche  : ma position → 1re étape, avec SON propre mode ;
   2) le parcours : 1re étape → … → dernière étape, avec le mode de la sortie.
   Google Maps n'accepte qu'un seul mode par itinéraire : les séparer permet
   d'aller au point de départ en transports puis de marcher le parcours.       */

function pointMaps(e){
  return (e.lat!=null && e.lng!=null) ? e.lat+","+e.lng
    : (/bruxelles|brussel|brussels/i.test(e.nom) ? e.nom : e.nom+", Bruxelles");
}
function urlMaps({origine=null, destination, inter=[], travelmode}){
  let url="https://www.google.com/maps/dir/?api=1"+
    "&destination="+encodeURIComponent(destination)+
    "&travelmode="+travelmode;
  if(origine) url+="&origin="+encodeURIComponent(origine);
  if(inter.length) url+="&waypoints="+inter.map(encodeURIComponent).join("%7C");
  window.open(url,"_blank");
}

    '<p style="font-size:.85rem;color:var(--texte-2);margin:-.3rem 0 .8rem">Destination : '+esc(s.etapes[0].nom)+'</p>'+
    '<button class="btn btn-clair" onclick="lancerApproche(\'transit\')">Transports en commun</button>'+

async function ouvrirParcours(){
  const s=await dbLire(idCourant);
  if(!s.etapes || s.etapes.length<2){ toast("Il faut au moins deux étapes pour un parcours."); return; }
  if(s.modeDeplacement==="mixte"){
    ouvrirFeuille('<h3>Parcours mixte — quel mode pour Google Maps ?</h3>'+
      '<button class="btn btn-clair" onclick="lancerParcours(\'walking\')">À pied</button>'+

      '<button class="btn btn-clair" onclick="lancerParcours(\'transit\')">Transports en commun</button>');
  } else {
    lancerParcours({pied:"walking", velo:"bicycling", transports:"transit"}[s.modeDeplacement]||"walking");

async function lancerParcours(travelmode){
  fermerFeuille();
  const s=await dbLire(idCourant);
  const pts=s.etapes.map(pointMaps);
  const origine=pts[0], destination=pts[pts.length-1];
  let inter=pts.slice(1,-1);
  if(travelmode==="transit" && inter.length){
    inter=[];
    toast("Google Maps ignore les étapes intermédiaires en transports en commun : itinéraire direct vers "+s.etapes[s.etapes.length-1].nom+".");
  } else if(inter.length>9){
    inter=inter.slice(0,9);
    toast("Google Maps limite à 9 étapes intermédiaires : les suivantes ont été laissées de côté.");
  }
  urlMaps({origine, destination, inter, travelmode});
}

async function compresserImage(fichier, maxDim=1600, qualite=0.85){
  const bitmap=await createImageBitmap(fichier).catch(()=>null);
  if(!bitmap) return fichier; // format non lisible : on garde tel quel
  let {width:w, height:h}=bitmap;
  if(w>maxDim || h>maxDim){
    const r=Math.min(maxDim/w, maxDim/h);
    w=Math.round(w*r); h=Math.round(h*r);
  }
  const canvas=document.createElement("canvas");
  canvas.width=w; canvas.height=h;
  canvas.getContext("2d").drawImage(bitmap,0,0,w,h);
  bitmap.close && bitmap.close();
  return new Promise(res=>canvas.toBlob(b=>res(b||fichier),"image/jpeg",qualite));
}
async function importerPhotos(fichiers){
  if(!fichiers.length || !idCourant) return;
  toast("Traitement des photos…", 6000);
  const s=await dbLire(idCourant);

  toast(fichiers.length>1 ? fichiers.length+" photos ajoutées." : "Photo ajoutée.");
}

  const j=i+delta;

/* ---------- Partage (.txt, champs du template uniquement) ---------- */
const MODES_TXT={pied:"à pied", velo:"vélo", transports:"transports", mixte:"mixte"};
async function partagerSortie(){
  const s=await dbLire(idCourant);
  const txt =
    "1. "+s.titre+"\n\n"+
    "Appareil : "+(s.appareil||"")+"\n"+
    "Moment idéal : "+(s.moment||"")+"\n"+
    "Parcours ("+MODES_TXT[s.modeDeplacement]+") :\n"+
    s.etapes.map(e=>e.nom).join("\n")+"\n"+
    "Pourquoi : "+(s.pourquoi||"")+"\n"+
    "Intention : "+(s.intention||"")+"\n"+
    /* E7 — le texte informatif décrit le parcours, pas la visite : il part
       avec le fichier, contrairement aux photos, notes et matériel. */
    ((s.infoParcours||"").trim() ? "Info :\n"+s.infoParcours.trim()+"\n" : "")+
    "\nRéf. parcours : "+(s.idParcours||"")+"\n";
  const nomFichier="sortie-"+(s.titre||"sans-titre").toLowerCase()
      .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
      .replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,50)+".txt";
  const fichier=new File([txt], nomFichier, {type:"text/plain"});
  if(navigator.canShare && navigator.canShare({files:[fichier]})){
    try{ await navigator.share({files:[fichier], title:s.titre}); }
    catch(e){ /* partage annulé par l'utilisateur */ }
  } else {
    const a=document.createElement("a");
    a.href=URL.createObjectURL(fichier); a.download=nomFichier;
    a.click(); URL.revokeObjectURL(a.href);
    toast("Fichier .txt téléchargé (le partage direct n'est pas disponible ici).");
  }
}

    '<button class="btn btn-clair" onclick="fermerFeuille();ouvrirFormulaire()">Créer à la main</button>');
}

/* ---------- Lecture du fichier .txt (FR / EN) ---------- */
const LIBELLES=[
  {champ:"appareil",  re:/^(appareil|camera)\s*:\s*(.*)$/i},
  {champ:"moment",    re:/^(moment(?:\s+id[ée]al)?|best time)\s*:\s*(.*)$/i},
  {champ:"itineraire",re:/^(parcours|itin[ée]raire|simple route|route)\s*(?:\(([^)]*)\))?\s*:\s*(.*)$/i},
  {champ:"pourquoi",  re:/^(pourquoi(?:\s+maintenant)?|why now)\s*:\s*(.*)$/i},
  {champ:"intention", re:/^(intention(?:\s+cr[ée]ative)?|in-camera creative intention|creative intention)\s*:\s*(.*)$/i},
  /* E7 — texte documentaire. Se place en dernier dans le bloc : tout ce qui
     suit, lignes vides comprises, lui appartient jusqu'à la sortie suivante. */
  {champ:"infoParcours", re:/^(info(?:rmations?)?|[àa]\s+savoir|notice|about|background)\s*:\s*(.*)$/i},
  /* E6 — ligne technique ajoutée à l'export ; si elle a été supprimée en
     éditant le fichier à la main, le rattrapage par titre prend le relais. */
  {champ:"idParcours", re:/^(r[ée]f\.?\s*parcours|reference parcours)\s*:\s*(.*)$/i}
];
function detecterMode(parenthese){
  const p=(parenthese||"").toLowerCase();
  if(/mixte|mixed|mix\b/.test(p)) return "mixte";
  const trouves=[];
  if(/pied|march|walk/.test(p)) trouves.push("pied");
  if(/v[ée]lo|bike|cycl/.test(p)) trouves.push("velo");
  if(/transport|public|m[ée]tro|tram|bus|transit/.test(p)) trouves.push("transports");
  if(trouves.length===1) return trouves[0];
  if(trouves.length>1) return "mixte";
  return "pied";
}
function analyserTxt(texte){
  const lignes=texte.replace(/\r\n?/g,"\n").split("\n");
  const sorties=[];
  let courante=null, champActif=null;
  const reTitre=/^\s*(\d+)[\.\)]\s+(.+)$/;
  for(const brute of lignes){
    const ligne=brute.trim();
    const mTitre=ligne.match(reTitre);
    if(mTitre){
      if(courante) sorties.push(courante);
      courante={titre:mTitre[2].trim(), appareil:"", moment:"", modeDeplacement:"pied",
                etapes:[], pourquoi:"", intention:"", infoParcours:""};
      champActif=null;
      continue;
    }
    if(!courante) continue;
    /* Une ligne vide ferme le champ en cours — sauf pour les étapes (déjà le
       cas avant) et sauf pour le texte informatif, où elle marque une
       séparation de paragraphe et non une fin de champ.                     */
    if(!ligne){
      if(champActif==="infoParcours"){
        if(courante.infoParcours) courante.infoParcours+="\n\n";
      } else if(champActif!=="etapes") champActif=null;
      continue;
    }
    let reconnu=false;
    for(const lib of LIBELLES){
      const m=ligne.match(lib.re);
      if(m){
        reconnu=true;
        if(lib.champ==="itineraire"){
          courante.modeDeplacement=detecterMode(m[2]);
          champActif="etapes";
          const reste=(m[3]||"").trim();
          if(reste) courante.etapes.push({nom:reste});
        } else {
          champActif=lib.champ;
          courante[lib.champ]=(m[2]||"").trim();
        }
        break;
      }
    }
    if(reconnu) continue;
    if(champActif==="etapes"){
      courante.etapes.push({nom:ligne});
    } else if(champActif==="infoParcours"){
      /* pas de .trim() ici : il effacerait la séparation de paragraphe
         que la ligne vide vient d'inscrire. */
      courante.infoParcours += (!courante.infoParcours ? ""
        : (/\n\n$/.test(courante.infoParcours) ? "" : " ")) + ligne;
    } else if(champActif){
      courante[champActif]=(courante[champActif]+" "+ligne).trim();
    }
  }
  if(courante) sorties.push(courante);
  return sorties.map(s=>{ s.infoParcours=(s.infoParcours||"").trim(); return s; });
}
let importEnAttente=[];
document.getElementById("fichier-txt").addEventListener("change", async e=>{
  const f=e.target.files[0]; e.target.value="";
  if(!f) return;
  const texte=await f.text();
  const trouvees=analyserTxt(texte);
  if(!trouvees.length){
    toast("Aucune sortie reconnue dans ce fichier. Vérifiez le format (« 1. Titre », « Appareil : »…).", 4500);
    return;
  }
  importEnAttente=trouvees.map(t=>Object.assign({inclure:true}, t));
  afficherApercuImport();
  montrerEcran("import");
});
function afficherApercuImport(){
  const ecran=document.getElementById("ecran-import");
  ecran.innerHTML=
    '<p style="font-size:.92rem;color:var(--texte-2);margin-bottom:1rem">'+
      importEnAttente.length+' sortie(s) reconnue(s). Vérifiez, décochez celles à ignorer, puis validez. '+
      'Vous pourrez tout modifier ensuite dans chaque fiche.</p>'+
    importEnAttente.map((t,i)=>
      '<div class="apercu-sortie'+(t.inclure?"":" exclu")+'" id="apercu-'+i+'">'+
        '<div class="apercu-entete">'+
          '<input type="checkbox" '+(t.inclure?"checked":"")+' onchange="importEnAttente['+i+'].inclure=this.checked;document.getElementById(\'apercu-'+i+'\').classList.toggle(\'exclu\',!this.checked)">'+
          '<h3>'+esc(t.titre)+'</h3>'+
        '</div>'+
        '<div class="apercu-detail">'+
          '<div><b>Appareil :</b> '+esc(t.appareil||"—")+'</div>'+
          '<div><b>Moment :</b> '+esc(t.moment||"—")+'</div>'+
          '<div><b>Mode :</b> '+MODES_LIB[t.modeDeplacement]+' · <b>Étapes :</b> '+t.etapes.length+'</div>'+
          '<div><b>Pourquoi :</b> '+esc((t.pourquoi||"—").slice(0,90))+((t.pourquoi||"").length>90?"…":"")+'</div>'+
          '<div><b>Intention :</b> '+esc((t.intention||"—").slice(0,90))+((t.intention||"").length>90?"…":"")+'</div>'+
          '<div><b>Information :</b> '+((t.infoParcours||"").trim()
            ? "texte fourni ("+(t.infoParcours.trim().length)+" signes)" : "aucune")+'</div>'+
        '</div>'+
      '</div>').join("")+
    '<button class="btn btn-ambre" onclick="validerImport()">Importer la sélection</button>';
}
async function validerImport(){
  const retenues=importEnAttente.filter(t=>t.inclure);
  if(!retenues.length){ toast("Aucune sortie sélectionnée."); return; }
  const tous=await dbTous();
  let numero=tous.reduce((m,x)=>Math.max(m,x.numero||0),0);
  for(const t of retenues){
    numero++;
    /* E6 — trois cas, dans cet ordre :
       1. le fichier porte une référence de parcours → on la conserve telle
          quelle, c'est ce qui rattachera cette copie aux autres ;
       2. pas de référence, mais une sortie de même titre existe déjà ici →
          on reprend son identifiant (filet de sécurité si la ligne a été
          effacée à la main) ;
       3. sinon, nouvel identifiant.                                        */
    const refFichier=(t.idParcours||"").trim();
    const jumelle = refFichier ? null
      : tous.find(x=> normaliserTitre(x.titre)===normaliserTitre(t.titre) && x.idParcours);
    await dbEcrire(nouvelleSortie({
      titre:t.titre, numero, modeDeplacement:t.modeDeplacement,
      appareil:t.appareil, moment:t.moment, etapes:t.etapes,
      pourquoi:t.pourquoi, intention:t.intention,
      infoParcours:t.infoParcours||"",
      idParcours: refFichier || (jumelle ? jumelle.idParcours : nouvelIdParcours())
    }));
  }
  importEnAttente=[];
  toast(retenues.length>1 ? retenues.length+" sorties importées." : "Sortie importée.");
  pileEcrans=[]; idCourant=null;
  await afficherListe();
  montrerEcran("liste", false);
}

/* ---------- Réglages : sauvegarde, restauration, stockage ---------- */
async function ouvrirReglages(){
  const derniere=localStorage.getItem("derniereSauvegarde");
  let stockage="—";
  if(navigator.storage && navigator.storage.estimate){
    try{
      const est=await navigator.storage.estimate();
      const mo=v=>(v/1048576).toFixed(1).replace(".",",")+" Mo";
      stockage=mo(est.usage||0)+" utilisés"+(est.quota? " (sur ~"+mo(est.quota)+" disponibles)":"");
    }catch(e){}
  }
  let persistant="";
  if(navigator.storage && navigator.storage.persisted){
    try{ persistant=(await navigator.storage.persisted()) ? "Oui" : "Non (demandé au navigateur)"; }catch(e){}
  }
  ouvrirFeuille('<h3>Réglages et données</h3>'+
    '<div class="stat"><span>Version de l\'app</span><span>'+VERSION+' — '+DATE_VERSION+'</span></div>'+
    '<div class="stat"><span>Auteur</span><span>'+AUTEUR+'</span></div>'+
    '<div class="stat"><span>Dernière sauvegarde</span><span>'+(derniere? dateFR(derniere):"Jamais")+'</span></div>'+
    '<div class="stat"><span>Espace utilisé</span><span>'+stockage+'</span></div>'+
    (persistant? '<div class="stat"><span>Stockage protégé</span><span>'+persistant+'</span></div>':"")+
    '<hr>'+
    '<button class="btn btn-plein" onclick="ouvrirCommentaires()">Commentaires</button>'+
    '<button class="btn btn-clair" onclick="window.open(URL_KOFI,\'_blank\')">Soutenir le projet ☕</button>'+
    '<button class="btn btn-plein" onclick="exporterSauvegarde()">Sauvegarder tout (fichier)</button>'+
    '<button class="btn btn-clair" onclick="fermerFeuille();document.getElementById(\'fichier-restauration\').click()">Restaurer une sauvegarde</button>'+
    '<button class="btn btn-clair" onclick="fermerFeuille();rechargerParcoursLivres()">Remettre les parcours d\'origine</button>'+
    '<p style="margin-top:.4rem">La sauvegarde est un fichier unique (sorties, photos et notes incluses) à ranger sur votre ordinateur ou votre drive. La restauration remplace tout le contenu actuel de l\'app.</p>'+
    '<p style="margin-bottom:0;font-size:.78rem;text-align:center">© 2026 '+AUTEUR+' — Tous droits réservés.</p>');
}

function ouvrirCommentaires(){
  ouvrirFeuille('<h3>Commentaires</h3>'+
    '<p>Une remarque, une idée, un souci ? Écrivez votre message : le bouton « Envoyer » ouvrira votre application mail, il ne restera qu\'à confirmer l\'envoi.</p>'+

}
function envoyerCommentaire(){
  const texte=document.getElementById("texte-commentaire").value.trim();
  if(!texte){ toast("Écrivez d'abord votre commentaire."); return; }
  const objet="Commentaire — Repérages "+VERSION;
  window.location.href="mailto:"+MAIL_AUTEUR+
    "?subject="+encodeURIComponent(objet)+
    "&body="+encodeURIComponent(texte);
  fermerFeuille();
}
function blobVersDataUrl(blob){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>res(r.result); r.onerror=()=>rej(r.error);
    r.readAsDataURL(blob);
  });
}
async function dataUrlVersBlob(dataUrl){
  const rep=await fetch(dataUrl);
  return rep.blob();
}
async function exporterSauvegarde(){
  fermerFeuille();
  toast("Préparation de la sauvegarde…", 8000);
  const sorties=await dbTous();
  const exportables=[];
  for(const s of sorties){
    const copie=Object.assign({}, s);
    copie.photos=[];
    for(const p of (s.photos||[])){
      copie.photos.push({id:p.id, legende:p.legende||"", dateAjout:p.dateAjout,
                         dataUrl:await blobVersDataUrl(p.blob)});
    }
    exportables.push(copie);
  }
  const contenu=JSON.stringify({app:"carnet-sorties", versionApp:VERSION, versionDonnees:1,
                                dateExport:new Date().toISOString(), sorties:exportables});
  const d=new Date();
  const nom="sauvegarde-reperages-"+d.getFullYear()+"-"+
    String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")+".json";
  const blob=new Blob([contenu],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=nom;
  a.click(); URL.revokeObjectURL(a.href);
  localStorage.setItem("derniereSauvegarde", new Date().toISOString());
  await afficherListe();
  toast("Sauvegarde téléchargée ("+nom+").", 4000);
}
document.getElementById("fichier-restauration").addEventListener("change", async e=>{
  const f=e.target.files[0]; e.target.value="";
  if(!f) return;
  let donnees;
  try{ donnees=JSON.parse(await f.text()); }
  catch(err){ toast("Ce fichier n'est pas une sauvegarde valide."); return; }
  if(!donnees || donnees.app!=="carnet-sorties" || !Array.isArray(donnees.sorties)){
    toast("Ce fichier n'est pas une sauvegarde du carnet."); return;
  }
  ouvrirFeuille('<h3>Restaurer cette sauvegarde ?</h3>'+
    '<p>Sauvegarde du '+dateFR(donnees.dateExport)+' — '+donnees.sorties.length+' sortie(s).<br>'+
    '<b>Attention :</b> tout le contenu actuel de l\'app sera remplacé.</p>'+
    '<button class="btn btn-ambre" onclick="executerRestauration()">Remplacer et restaurer</button>'+
    '<button class="btn btn-clair" onclick="fermerFeuille();restaurationEnAttente=null">Annuler</button>');
  window.restaurationEnAttente=donnees;
});
async function executerRestauration(){
  fermerFeuille();
  const donnees=window.restaurationEnAttente;
  if(!donnees) return;
  toast("Restauration en cours…", 8000);
  urlsObjets.forEach(u=>URL.revokeObjectURL(u)); urlsObjets.clear();
  await dbVider();
  for(const s of donnees.sorties){
    const copie=Object.assign(nouvelleSortie({}), s);
    copie.photos=[];
    for(const p of (s.photos||[])){
      copie.photos.push({id:p.id||uuid(), legende:p.legende||"", dateAjout:p.dateAjout,
                         blob:await dataUrlVersBlob(p.dataUrl)});
    }
    await dbEcrire(copie);
  }
  window.restaurationEnAttente=null;
  localStorage.setItem("derniereSauvegarde", donnees.dateExport||new Date().toISOString());
  idCourant=null; pileEcrans=[];
  await afficherListe();
  montrerEcran("liste", false);
  toast("Restauration terminée : "+donnees.sorties.length+" sortie(s).", 4000);
}

});

/* ---------- PWA : service worker et mise à jour propre ----------
   Actif uniquement en ligne (GitHub Pages). Ouvert en fichier local,
   l'app fonctionne comme avant, simplement sans installation PWA. */
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  navigator.serviceWorker.register("sw.js").then(reg=>{
    // Une nouvelle version vient d'être trouvée sur le serveur.
    reg.addEventListener("updatefound", ()=>{
      const nouveau=reg.installing;
      if(!nouveau) return;
      nouveau.addEventListener("statechange", ()=>{
        // "installed" + un SW déjà en place = mise à jour prête.
        if(nouveau.state==="installed" && navigator.serviceWorker.controller){
          proposerMiseAJour(reg);
        }
      });
    });
    // Vérifie aussi à chaque ouverture (le mobile garde l'app en mémoire).
    reg.update().catch(()=>{});
  }).catch(()=>{ /* pas bloquant : l'app fonctionne sans SW */ });

  // Quand le nouveau SW prend la main, on recharge une seule fois.
  let dejaRecharge=false;
  navigator.serviceWorker.addEventListener("controllerchange", ()=>{
    if(dejaRecharge) return;
    dejaRecharge=true;
    location.reload();
  });
}
function proposerMiseAJour(reg){
  if(document.getElementById("bandeau-maj")) return;
  const b=document.createElement("div");
  b.id="bandeau-maj";
  b.style.cssText="position:fixed;left:50%;transform:translateX(-50%);"+
    "bottom:calc(6rem + env(safe-area-inset-bottom));z-index:60;"+
    "background:var(--anthracite);color:#F9FAFB;border-radius:999px;"+
    "padding:.6rem .7rem .6rem 1.1rem;display:flex;align-items:center;gap:.8rem;"+
    "box-shadow:0 3px 10px rgba(0,0,0,.3);font-size:.9rem;max-width:92vw";
  b.innerHTML='<span>Nouvelle version disponible</span>'+
    '<button id="btn-maj" style="background:var(--ambre);color:#fff;font-weight:600;'+
    'border-radius:999px;padding:.45rem .9rem">Recharger</button>';
  document.body.appendChild(b);
  document.getElementById("btn-maj").onclick=()=>{
    if(reg.waiting) reg.waiting.postMessage({type:"SKIP_WAITING"});
    b.remove();
  };
}
